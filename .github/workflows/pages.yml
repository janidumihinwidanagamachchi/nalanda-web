name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # verify runs the production build itself, then lints, walks every route
      # against a GitHub Pages-shaped static server, and checks outbound links.
      # out/ is the artifact it leaves behind, so there is no separate build step.
      - name: Build and verify
        run: npm run verify

      # Belt and braces: public/.nojekyll is already copied into out/ by the
      # build, but Pages must never run Jekyll or it will drop _next/.
      - name: Ensure .nojekyll is present
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4